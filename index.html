<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matcap Creator</title>
</head>

<body>
    <div id="app">
        <header class="header">
            <h1 class="header__brand">MatcapLab</h1>

            </div>
        </header>
        <div id="main">
            <div id="viewport" data-layout="split">
                <div id="preview"></div>
            </div>
            <div id="panel"></div>
        </div>
    </div>
    <script type="module" src="/src/app.ts"></script>
</body>

</html>
